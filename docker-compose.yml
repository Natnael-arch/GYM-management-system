version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gym_postgres
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: gym_db
    ports:
      - "5433:5432" # Mapped to 5433 per previous config
    volumes:
      - gym_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: gym_web
    environment:
      DATABASE_URL: postgresql://gym_user:gym_password@postgres:5432/gym_db?schema=public
      BETTER_AUTH_SECRET: gym_secret_key_12345
      ZKTECO_IP: ${ZKTECO_IP:-192.168.100.5}
      ZKTECO_PORT: ${ZKTECO_PORT:-4370}
      ZKTECO_PASSWORD: ${ZKTECO_PASSWORD:-0}
      ZKTECO_TIMEOUT: ${ZKTECO_TIMEOUT:-10}
      ZKTECO_PYTHON: python3
      MOCK_ZKTECO: ${MOCK_ZKTECO:-false}
    # NOTE: the MB100 must be reachable from this container on TCP 4370.
    # If the device is on the host LAN, run the web service with
    # network_mode: "host" (Linux) or put both on the same LAN/VLAN.
    depends_on:
      - postgres
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: gym_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  gym_pgdata:
  caddy_data:
  caddy_config:
