version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gym_postgres
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
    volumes:
      - gym_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gym_pgdata:
